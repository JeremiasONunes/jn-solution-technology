    <meta property="og:site_name" content="JNunes Tech Solution" />

    <!-- Dados estruturados para o Google -->

      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "JNunes Tech Solution",
        "url": "https://jnsolucoestecnologicas.com.br/",

        "description": "Manutenção de computadores, infraestrutura de TI e desenvolvimento de sites, sistemas e automações para pessoas e empresas.",

        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+55-35-99850-0813",
          "contactType": "customer service",
          "availableLanguage": "Portuguese"
        },
        "knowsAbout": [
          "Manutenção de computadores",

          "Redes",

          "Sistemas web",

    <!-- Foto principal (LCP): pré-carregada para não esperar o JavaScript.

    <link
      rel="preload"
      as="image"
      href="/src/assets/images/hero-manutencao-1024.webp"
      imagesrcset="/src/assets/images/hero-manutencao-480.webp 480w, /src/assets/images/hero-manutencao-640.webp 640w, /src/assets/images/hero-manutencao-1024.webp 1024w"

      fetchpriority="high"
    />

  <body>
